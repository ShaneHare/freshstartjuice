<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freshstart Juices</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
</head>
<body>
  <p>This page has moved. <a href="checkout.html" id="fallbackLink">Continue to checkout</a>.</p>
  <script>
    // Preserve any pack/cadence/box params from old subscribe.html links
    // and forward them to the new universal checkout page.
    var qs = new URLSearchParams(location.search);
    if (!qs.has('type')) qs.set('type', 'subscribe');
    var target = 'checkout.html?' + qs.toString();
    document.getElementById('fallbackLink').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
